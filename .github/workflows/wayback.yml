name: Archivo web (reconstrucción de historia)

# Reconstruye historia de precios con copias del archivo web (Wayback Machine): combustibles por día y
# (después) tiendas de ropa y electro. Corre al modificar los scripts o a mano.
on:
  push:
    paths:
      - scripts/wayback_surtidores.py
      - .github/workflows/wayback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Combustibles por día
        run: python scripts/wayback_surtidores.py
      - name: Guardar
        run: |
          git config user.name "ipc-nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios/combustibles/ypf_caba_wayback.csv
          git commit -q -m "Archivo web: combustibles por día" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 10; done
