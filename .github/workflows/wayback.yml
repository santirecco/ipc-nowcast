name: Archivo web (reconstrucción de historia)

# Reconstruye historia de precios con copias del archivo web (Wayback Machine): combustibles por día y
# (después) tiendas de ropa y electro. Corre al modificar los scripts o a mano.
on:
  push:
    paths:
      - scripts/wayback_tiendas.py
      - .github/workflows/wayback.yml
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"   # sigue sola hasta terminar (si no hay nada pendiente, termina enseguida)

permissions:
  contents: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # combustibles por día: probado en nov-2026, el archivo tiene solo ~30 copias de la página desde 2023 (no alcanza)
      - name: Tiendas de ropa y electro
        run: python scripts/wayback_tiendas.py || true
      - name: Guardar
        if: always()
        run: |
          git config user.name "ipc-nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios/combustibles/ypf_caba_wayback.csv data/precios/wayback || true
          git commit -q -m "Archivo web: combustibles y tiendas" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 10; done
