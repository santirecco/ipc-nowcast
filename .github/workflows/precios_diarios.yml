name: Precios diarios y pronóstico

# Todos los días a las 07:17 (hora Argentina):
#   1. baja los precios de los supermercados online
#   2. baja los precios de SEPA del día anterior (todas las cadenas grandes del país)
#   3. baja precios mayoristas: Mercado Central (verduras y frutas) y hacienda (carne)
#      y también combustibles (YPF) y dólar mayorista (BCRA)
#   4. actualiza el IPC de la Ciudad de Buenos Aires (sale unos días antes que INDEC)
#   5. recalcula el pronóstico del mes y guarda todo en el repo
# También se puede correr a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Supermercados (Carrefour, Jumbo, Disco, Vea, Día)
        run: python scripts/scrapear_supermercados.py
      - name: Recuperar precios SEPA ya procesados (caché)
        uses: actions/cache/restore@v4
        with:
          path: data/cache/sepa
          key: sepa-${{ github.run_id }}
          restore-keys: sepa-
      - name: SEPA (Precios Claros, todo el país)
        continue-on-error: true
        run: SEPA_TRABAJADORES=3 python scripts/actualizar_sepa.py
      - name: Guardar precios SEPA procesados (caché)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/sepa
          key: sepa-${{ github.run_id }}
      - name: Mayoristas (Mercado Central y hacienda)
        continue-on-error: true
        run: python scripts/actualizar_mayoristas.py
      - name: Combustibles, dólar y REM
        continue-on-error: true
        run: python scripts/actualizar_indicadores.py
      - name: IPC Ciudad de Buenos Aires
        continue-on-error: true
        run: python scripts/actualizar_ipcba.py
      - name: Pronóstico del mes
        run: |
          python scripts/nowcast.py
          python scripts/exportar_tablero.py
          python scripts/generar_html.py
      - name: Guardar datos en el repo
        run: |
          git config user.name "ipc-nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports config
          git commit -q -m "Precios y pronóstico $(date +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
