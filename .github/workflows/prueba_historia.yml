name: Prueba de historia mayorista

# Busca historia de precios mayoristas de verduras y frutas (2022-2025) y de surtidores. Corre al modificar el script.
on:
  push:
    paths:
      - scripts/pruebas/fuentes_historia.py
      - scripts/pruebas/monitoreo_mc.py
      - scripts/pruebas/iiep_tarifas.py
      - scripts/pruebas/servicios_sondeo.py
      - scripts/pruebas/servicios_sondeo2.py
      - scripts/pruebas/servicios_sondeo3.py
      - scripts/pruebas/servicios_sondeo4.py
      - .github/workflows/prueba_historia.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python scripts/pruebas/servicios_sondeo4.py || true
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "ipc-nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/prueba_servicios*
          git commit -m "Sondeo de fuentes: restaurantes y turismo" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 10; done
