name: Prueba de historia mayorista

# Busca historia de precios mayoristas de verduras y frutas (2022-2025) y de surtidores. Corre al modificar el script.
on:
  push:
    paths:
      - scripts/pruebas/fuentes_historia.py
      - scripts/pruebas/monitoreo_mc.py
      - scripts/pruebas/iiep_tarifas.py
      - .github/workflows/prueba_historia.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python scripts/pruebas/iiep_tarifas.py || true
      - name: Guardar resultado
        run: |
          git config user.name "ipc-nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios/regulados/iiep reports/prueba_iiep.md
          git commit -m "Reportes de tarifas del IIEP (texto)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 10; done
